name: Runner Probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-13, macos-15-intel, macos-13-large, macos-latest]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "LABEL=${{ matrix.label }}"
          echo "ARCH=$(uname -m)"
          sw_vers
          xcodebuild -version || true
          ls /Applications | grep -i xcode || true
